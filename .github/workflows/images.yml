# Builds Tessera's two images (the API and the dashboard) for 64-bit Intel/AMD and ARM and
# publishes them on GitHub's registry as ghcr.io/lephorx/tessera-api and tessera-web,
# tagged with backend/VERSION and "latest". Installations pull them instead of building
# (scripts/up.sh), so an update downloads the changed layers in seconds. The update banner
# waits until the images of a new version are there (update_manager.images_ready).
name: Images

on:
  push:
    branches: [main]
    paths: [backend/**, frontend/**, docker-compose.yml, .github/workflows/images.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: The compose file names this version's images
        run: |
          VERSION=$(tr -d '[:space:]' < backend/VERSION)
          for name in api web; do
            grep -q "image: ghcr.io/lephorx/tessera-$name:$VERSION\$" docker-compose.yml \
              || { echo "::error::docker-compose.yml must use ghcr.io/lephorx/tessera-$name:$VERSION"; exit 1; }
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        image: [api, web]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: api
            context: backend
          - image: web
            context: frontend
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
          outputs: type=image,name=ghcr.io/lephorx/tessera-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Keep the digest
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.image }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag both platforms as one image
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          for name in api web; do
            repo=ghcr.io/lephorx/tessera-$name
            docker buildx imagetools create -t "$repo:$VERSION" -t "$repo:latest" \
              "$repo@$(cat digests/$name-amd64)" "$repo@$(cat digests/$name-arm64)"
            docker buildx imagetools inspect "$repo:$VERSION"
          done
