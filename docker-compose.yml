services:
  api:
    # built by GitHub for each version (.github/workflows/images.yml; scripts/up.sh pulls it);
    # Compose builds it here when it's missing. Bumped with backend/VERSION.
    image: ghcr.io/lephorx/tessera-api:1.19.1
    build: ./backend
    restart: unless-stopped
    env_file: .env
    # SELinux (Fedora, RHEL) would block the Docker socket and the data folders
    security_opt:
      - label:disable
    environment:
      SERVERS_DIR: /data/servers
      BACKUPS_DIR: /data/backups
      DB_PATH: /app/data/cscm.db
      AUTH_DB_PATH: /app/data/cscm.db
      PLAYIT_HEADLESS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SERVERS_DIR_HOST:-/opt/cscm/servers}:/data/servers
      - ${BACKUPS_DIR_HOST:-/opt/cscm/backups}:/data/backups
      - ${DATA_DIR_HOST:-./data}:/app/data
      # connection settings saved from the dashboard are written back here
      - ./.env:/app/cscm.env
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: ghcr.io/lephorx/tessera-web:1.19.1
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      CSCM_API_URL: http://api:5000
    ports:
      - "${WEB_PORT:-3000}:3000"
